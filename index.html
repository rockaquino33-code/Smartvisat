<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elisa TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0a0a0a;color:#fff;overflow:hidden;height:100vh}
.sidebar{position:fixed;left:0;top:0;width:240px;height:100%;background:#111;padding:25px 12px;z-index:20;border-right:1px solid #222}
.logo{font-size:26px;font-weight:800;color:#00d4ff;margin-bottom:35px;padding-left:10px}
.menu-item{display:flex;align-items:center;padding:14px 12px;margin:6px 0;border-radius:10px;cursor:pointer}
.menu-item:hover,.menu-item.active{background:#00d4ff1a;color:#00d4ff}
.menu-item i{font-size:22px;width:32px}
.menu-item span{margin-left:12px;font-size:16px;font-weight:500}
.content{margin-left:240px;padding:30px;height:100vh;overflow-y:auto}
.titulo{font-size:32px;margin-bottom:20px;font-weight:700}
.destaques{display:flex;gap:20px;overflow-x:auto;padding-bottom:30px}
.card{min-width:360px;height:200px;border-radius:16px;background:#1a1a1a;background-size:cover;background-position:center;cursor:pointer;transition:.3s;position:relative}
.card:hover{transform:scale(1.04)}
.card-titulo{position:absolute;bottom:15px;left:15px;z-index:2;font-size:18px;font-weight:600;text-shadow:0 2px 4px #000}
.dock{position:fixed;bottom:25px;left:260px;right:25px;height:80px;background:#111111e6;backdrop-filter:blur(15px);border-radius:24px;display:flex;align-items:center;justify-content:center;gap:30px;z-index:20;border:1px solid #222}
.app-icon{width:56px;height:56px;border-radius:14px;background:#1f1f1f;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;border:1px solid #333}
.app-icon:active{transform:scale(0.9)}
.app-icon img{width:32px;height:32px;object-fit:contain}
.player{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:100}
.player iframe{width:100%;height:100%;border:none}
.btn-fechar{position:absolute;top:25px;right:25px;width:50px;height:50px;background:#ff0044dd;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:101;font-size:24px}
.teclado{display:none;position:fixed;bottom:0;left:0;width:100%;background:#141414;padding:15px;z-index:200;border-top:1px solid #333}
.campo-busca{width:100%;padding:15px;font-size:18px;border-radius:12px;border:2px solid #333;margin-bottom:15px;background:#222;color:#fff;outline:none}
.teclas{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.tecla{padding:14px 0;background:#2a2a2a;border:none;border-radius:8px;color:#fff;font-size:18px;cursor:pointer}
.tecla:active{background:#00d4ff}
.tecla-espaco{grid-column:span 4}
.tecla-enter{grid-column:span 2;background:#00d4ff}
.tecla-apagar{grid-column:span 2}
@media(max-width:768px){
.sidebar{width:75px;padding:20px 5px}
.menu-item span,.logo{display:none}
.menu-item{justify-content:center;padding:14px 0}
.content{margin-left:75px;padding:20px 15px}
.titulo{font-size:24px}
.card{min-width:220px;height:130px}
.dock{left:85px;right:10px;height:70px;gap:18px;bottom:15px}
.app-icon{width:48px;height:48px}
.teclas{grid-template-columns:repeat(8,1fr);gap:6px}
.tecla{padding:12px 0;font-size:16px}
}
</style>
</head>
<body>

<div class="sidebar">
<div class="logo">ELISA TV</div>
<div class="menu-item active"><i>🏠</i><span>Início</span></div>
<div class="menu-item" onclick="abrirBusca('esportes ao vivo')"><i>⚽</i><span>Esportes</span></div>
<div class="menu-item" onclick="abrirBusca('filmes completos dublados')"><i>🎬</i><span>Filmes</span></div>
<div class="menu-item" onclick="abrirBusca('desenhos infantis')"><i>👶</i><span>Infantil</span></div>
<div class="menu-item" onclick="abrirBusca('noticias ao vivo')"><i>📰</i><span>Notícias</span></div>
<div class="menu-item" onclick="mostrarTeclado()"><i>🔍</i><span>Buscar</span></div>
<div class="menu-item" onclick="voltar()"><i>↩️</i><span>Voltar</span></div>
</div>

<div class="content">
<h1 class="titulo">Destaques</h1>
<div class="destaques">
<div class="card" style="background-image:url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=600')" onclick="abrirBusca('espn ao vivo')">
<div class="card-titulo">ESPN Ao Vivo</div>
</div>
<div class="card" style="background-image:url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600')" onclick="abrirBusca('filmes 2024')">
<div class="card-titulo">Filmes 2024</div>
</div>
<div class="card" style="background-image:url('https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=600')" onclick="abrirApp('youtube')">
<div class="card-titulo">YouTube Trends</div>
</div>

<div class="dock">
<div class="app-icon" onclick="abrirApp('netflix')" title="Netflix">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
</div>
<div class="app-icon" onclick="abrirApp('youtube')" title="YouTube">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
</div>
<div class="app-icon" onclick="abrirApp('amazon')" title="Prime Video">
<img src="https://upload.wikimedia.org/wikipedia/commons/f/f1/Prime_Video.png" alt="Prime">
</div>
<div class="app-icon" onclick="abrirApp('hbo')" title="HBO Max">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/17/HBO_Max_Logo.svg" alt="HBO">
</div>
<div class="app-icon" onclick="abrirApp('disney')" title="Disney+">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg" alt="Disney">
</div>
<div class="app-icon" onclick="abrirApp('xbox')" title="Xbox Cloud">
<img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/Xbox_one_logo.svg" alt="Xbox">
</div>
<div class="app-icon" onclick="mostrarTeclado()" title="Buscar">
🔍
</div>
</div>

<div class="player" id="player">
<div class="btn-fechar" onclick="fecharPlayer()">✕</div>
<iframe id="iframePlayer" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
</div>

<div class="teclado" id="teclado">
<input type="text" class="campo-busca" id="campoBusca" placeholder="Pesquisar no YouTube..." autocomplete="off">
<div class="teclas" id="teclas"></div>
</div>

<script>
const apps={
netflix:'https://www.netflix.com',
youtube:'https://www.youtube.com/tv',
amazon:'https://www.primevideo.com',
hbo:'https://play.hbomax.com',
disney:'https://www.disneyplus.com',
xbox:'https://www.xbox.com/play'
};

function abrirApp(app){
fecharTeclado();
if(app==='youtube'){
document.getElementById('player').style.display='block';
document.getElementById('iframePlayer').src=apps[app];
}else{
window.open(apps[app],'_blank');
}
}

function abrirBusca(termo){
fecharTeclado();
document.getElementById('player').style.display='block';
document.getElementById('iframePlayer').src='https://www.youtube.com/results?search_query='+encodeURIComponent(termo);
}

function fecharPlayer(){
document.getElementById('player').style.display='none';
document.getElementById('iframePlayer').src='';
}

function voltar(){
if(document.getElementById('player').style.display==='block')fecharPlayer();
else if(document.getElementById('teclado').style.display==='block')fecharTeclado();
}

function mostrarTeclado(){
document.getElementById('teclado').style.display='block';
document.getElementById('campoBusca').value='';
document.getElementById('campoBusca').focus();
if(!document.getElementById('teclas').innerHTML)criarTeclas();
}

function fecharTeclado(){
document.getElementById('teclado').style.display='none';
}

function criarTeclas(){
const layout=['q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l','⌫','z','x','c','v','b','n','m',' ','OK'];
const teclasDiv=document.getElementById('teclas');
teclasDiv.innerHTML='';
layout.forEach(t=>{
const btn=document.createElement('button');
btn.className='tecla';
btn.textContent=t===' '?'espaço':t==='⌫'?'apagar':t;
if(t===' ')btn.classList.add('tecla-espaco');
if(t==='OK')btn.classList.add('tecla-enter');
if(t==='⌫')btn.classList.add('tecla-apagar');
btn.onclick=()=>{
const campo=document.getElementById('campoBusca');
if(t==='⌫')campo.value=campo.value.slice(0,-1);
else if(t==='OK')buscarYouTube();
else campo.value+=t===' '?' ':t;
campo.focus();
};
teclasDiv.appendChild(btn);
});
}

function buscarYouTube(){
const termo=document.getElementById('campoBusca').value.trim();
if(termo)abrirBusca(termo);
fecharTeclado();
}

document.getElementById('campoBusca').addEventListener('keypress',e=>{
if(e.key==='Enter')buscarYouTube();
});
</script>

</body>
</html>
